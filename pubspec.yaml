name: quiet_vpn
description: Android VPN client for WireGuard, VLESS and Shadowsocks.
publish_to: none
version: 0.7.2+18
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_v2ray_client:
    git:
      url: https://github.com/amir-zr/flutter_v2ray_client.git
      ref: c296aad34eeed7d65119a310c79fc64ebf58251b
  crypto: 3.0.6
  file_picker: 10.1.9
  flutter_secure_storage: 9.2.4
  path_provider: 2.1.5
  url_launcher: 6.3.1
  permission_handler: 12.0.0+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/public-proxies.txt
    - assets/PUBLIC_SOURCE_LICENSE.txt
