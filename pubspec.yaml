publish_to: none
version: 0.5.3+9
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  csv: 6.0.0
  crypto: 3.0.6
  file_picker: 10.1.9
  flutter_secure_storage: 9.2.4
  path_provider: 2.1.5
  url_launcher: 6.3.1
  permission_handler: 12.0.0+1
  window_manager: 0.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
