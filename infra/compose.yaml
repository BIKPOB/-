services:
  catalog:
    build: .
    restart: unless-stopped
    volumes:
      - catalog_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
  tls:
    image: caddy:2
    restart: unless-stopped
    environment:
      CATALOG_DOMAIN: ${CATALOG_DOMAIN:?Set CATALOG_DOMAIN to your domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - catalog
volumes:
  catalog_data:
  caddy_data:
  caddy_config:
