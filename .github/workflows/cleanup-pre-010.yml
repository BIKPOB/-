name: Clean Actions before 0.10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-pre-010.yml']
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Delete completed pre-0.10 runs only
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const cutoff = '2026-10-17T08:54:32Z';
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...repo, created: '<' + cutoff, per_page: 100
            });
            if (runs.length > 374) throw new Error('Inventory exceeded reviewed limit');
            const versions = new Map();
            const eligible = [];
            for (const run of runs) {
              if (run.created_at >= cutoff || run.status !== 'completed') continue;
              if (!versions.has(run.head_sha)) {
                try {
                  const {data} = await github.rest.repos.getContent({
                    ...repo, path: 'pubspec.yaml', ref: run.head_sha
                  });
                  const source = Buffer.from(data.content, 'base64').toString('utf8');
                  const match = source.match(/^version:\s*(\d+)\.(\d+)\.(\d+)/m);
                  versions.set(run.head_sha, match ? match.slice(1).map(Number) : null);
                } catch (e) {
                  if (e.status !== 404) throw e;
                  versions.set(run.head_sha, null);
                }
              }
              const v = versions.get(run.head_sha);
              if (v && v[0] === 0 && v[1] < 10) eligible.push(run);
              else core.info('Preserve unknown or newer version: ' + run.id);
            }
            core.info('Reviewed deletion count: ' + eligible.length);
            let deleted = 0;
            for (const run of eligible) {
              await github.rest.actions.deleteWorkflowRun({...repo, run_id: run.id});
              deleted++;
              core.info('Deleted ' + run.id + ' (' + versions.get(run.head_sha).join('.') + ')');
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            await core.summary.addHeading('Pre-0.10 Actions cleanup')
              .addRaw('Deleted completed old runs: ' + deleted + '. Preserved newer/unknown runs: ' + (runs.length - deleted) + '. Releases unchanged.')
              .write();
