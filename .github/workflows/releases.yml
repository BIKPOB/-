name: Publish verified builds
on:
  push:
    paths: ['.github/workflows/releases.yml']
  workflow_run:
    workflows: ['Build Android APK', 'Windows build and security audit']
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Source commit with successful Android and Windows builds'
        required: true
        type: string
      publish_release:
        description: 'Also publish a Release (requires repository release write access)'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
concurrency:
  group: quiet-vpn-releases
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish matching successful builds
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish_release && 'true' || 'false' }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha || 'd3cc778fc0dcd29932e0ca0ac6397cadcc9101c9' }}
        run: python .github/scripts/publish_release.py
      - name: Export verified downloads to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: quiet-vpn-verified-downloads
          path: release-payload/assets/
          if-no-files-found: error
          retention-days: 90
