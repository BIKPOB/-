name: Build Android APK
on:
  push:
    paths: ['lib/**', 'test/**', 'tools/**', 'platform_templates/**', 'pubspec*', '.github/workflows/verify.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Test browser configuration capture
        run: node tools/test_browser_capture.js
      - name: Prepare Android SDK
        run: |
          python - <<'PYSDK'
          import os, subprocess
          sdk = os.environ['ANDROID_HOME'] + '/cmdline-tools/latest/bin/sdkmanager'
          subprocess.run([sdk, '--licenses'], input='y\n' * 200, text=True, check=True)
          subprocess.run([sdk, 'platforms;android-36', 'ndk;27.0.12077973'], check=True)
          PYSDK
      - name: Generate Android runner
        run: python tools/bootstrap.py --platforms android
      - uses: actions/cache@v4
        id: awg-cache
        with:
          path: android/app/libs/amneziawg-tunnel.aar
          key: awg-ff15093bf3856fea0947923474870b86efb682f0-fgs-v2
      - name: Build pinned AmneziaWG Android tunnel
        if: steps.awg-cache.outputs.cache-hit != 'true'
        run: python tools/build_awg.py
      - name: Analyze Dart
        run: flutter analyze
      - name: Test Flutter core
        run: flutter test
      - name: Build mobile APK
        run: flutter build apk --release --target-platform android-arm64,android-arm
      - name: Test native WireGuard and browser integration
        run: python tools/test_native.py
      - name: Verify APK and record build metadata
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/quiet-vpn-android.apk
          python tools/verify_apk.py dist/quiet-vpn-android.apk
          cp pubspec.lock dist/DEPENDENCIES.lock
          sha256sum dist/quiet-vpn-android.apk > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
      - name: Antivirus scan APK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version > dist/ANTIVIRUS_VERSION.txt
          clamscan --allmatch --detect-pua=yes --alert-exceeds-max=yes --max-filesize=250M --max-scansize=700M --log=dist/ANTIVIRUS_SCAN.txt dist/quiet-vpn-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-vpn-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
