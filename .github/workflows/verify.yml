name: Build Android APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true
      - name: Verify catalog service
        run: python -m unittest discover -s tests -v
        working-directory: infra
      - name: Generate Android runner
        run: python tools/bootstrap.py --platforms android
      - name: Analyze Dart
        run: flutter analyze
      - name: Test Flutter core
        run: flutter test
      - name: Build mobile APK
        run: flutter build apk --release --target-platform android-arm64,android-arm
      - name: Verify APK and record build metadata
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/quiet-vpn-android.apk
          python tools/verify_apk.py dist/quiet-vpn-android.apk
          sha256sum dist/quiet-vpn-android.apk > dist/SHA256SUMS.txt
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-vpn-android-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
