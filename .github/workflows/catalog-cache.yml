name: Refresh public catalog cache
on:
  push:
    paths: ['.github/workflows/catalog-cache.yml', 'tools/update_catalog.py']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-catalog-cache
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python tools/update_catalog.py
        env:
          GH_TOKEN: ${{ github.token }}
