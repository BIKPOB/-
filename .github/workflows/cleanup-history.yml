name: Audit Quiet VPN Actions history (non-destructive)
# Historical stable releases and their tags must NEVER be removed by an Actions cleanup.
# This workflow is intentionally manual and read-only.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: List releases and build runs (no deletion)
        shell: bash
        run: |
          set -euo pipefail
          echo 'Stable releases (preserved):'
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | [.tag_name, .prerelease, .published_at] | @tsv'
          echo 'Recent build runs (preserved):'
          gh run list -R "$GH_REPO" --limit 30
          echo 'No releases, tags, workflow runs, or artifacts were deleted.'
