name: Windows build and security audit
on:
  push:
    paths: ['lib/**', 'tools/**', 'pubspec.yaml', '.github/workflows/security-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          cache: true
      - run: python tools/bootstrap.py --platforms windows
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Package Windows client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/windows/x64/runner/Release/* dist -Recurse
          Copy-Item tools/install-openvpn.ps1 dist
          Copy-Item docs/windows-install.txt dist/INSTALL.txt
          Copy-Item LICENSE.md dist
          Copy-Item pubspec.lock dist
          git rev-parse HEAD | Set-Content dist/SOURCE_COMMIT.txt
          Get-ChildItem dist -Recurse -File | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash )  $($_.FullName.Substring((Resolve-Path dist).Path.Length+1))" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-vpn-windows-x64
          path: dist/
          if-no-files-found: error
  audit-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact previously delivered APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit/apk
          gh run download 37057875626 -R BIKPOB/- -n quiet-vpn-android-apk -D audit/apk
          echo '4ebcd1911882d91ea9bfcfbdac8e1c34c1ed2bb6b0cfbe54d9fd762f19e1a698  audit/apk/quiet-vpn-android.apk' | sha256sum -c -
      - name: APK static inspection
        run: |
          python -m pip install androguard==4.1.3
          python tools/audit_apk.py audit/apk/quiet-vpn-android.apk audit/apk-static.json
      - name: Install and update antivirus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          clamscan --version | tee audit/antivirus-version.txt
      - name: Scan original APK and source
        run: |
          clamscan --recursive --allmatch --detect-pua=yes --alert-exceeds-max=yes --max-filesize=200M --max-scansize=500M --log=audit/apk-clamav.txt audit/apk lib tools platform_templates infra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-security-report
          path: |
            audit/*.txt
            audit/*.json
  audit-windows:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quiet-vpn-windows-x64
          path: windows-bundle
      - name: Install and update antivirus
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
          mkdir -p audit
          clamscan --version | tee audit/antivirus-version.txt
      - name: Scan Windows package
        run: clamscan --recursive --allmatch --detect-pua=yes --alert-exceeds-max=yes --max-filesize=200M --max-scansize=500M --log=audit/windows-clamav.txt windows-bundle
      - name: Check resolved Dart dependencies against OSV
        run: |
          python -m pip install PyYAML==6.0.2
          python tools/audit_dependencies.py windows-bundle/pubspec.lock audit/dependencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-security-report
          path: audit/
