name: Update 1.0.11 release notes
on:
  push:
    branches: [main]
    paths: ['docs/releases/1.0.11.md', '.github/workflows/release-notes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update notes without changing tag or binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit v1.0.11 --notes-file docs/releases/1.0.11.md
