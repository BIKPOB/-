name: Publish verified desktop and Android release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']
  workflow_run:
    workflows: ['Build Android APK', 'Build Windows installer']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-verified-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ github.event.workflow_run.id || '38437529917' }}
    steps:
      - name: Require successful Windows and Android builds from the same source
        id: builds
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          SOURCE_SHA=$(python3 -c "import json;print(json.load(open('run.json'))['head_sha'])")
          gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&per_page=100" > runs.json
          python3 - <<'PY'
          import json, os, re
          event = json.load(open('run.json'))
          sha = event['head_sha']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          runs = [r for r in json.load(open('runs.json'))['workflow_runs'] if
            r['head_sha'] == sha and r['event'] == 'push' and r['head_branch'] == 'main' and
            r['head_repository']['full_name'] == os.environ['GH_REPO'] and r['conclusion'] == 'success']
          android = next((r for r in runs if r['name'] == 'Build Android APK'), None)
          windows = next((r for r in runs if r['name'] == 'Build Windows installer'), None)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f'ready={str(bool(android and windows)).lower()}\n')
          if android and windows:
            with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"SOURCE_SHA={sha}\nANDROID_RUN={android['id']}\nWINDOWS_RUN={windows['id']}\n")
          else:
            print('Waiting for both platforms to pass; no release published.')
          PY
      - name: Download verified artifacts
        if: steps.builds.outputs.ready == 'true'
        run: |
          gh run download "$ANDROID_RUN" -n quiet-vpn-android-apk -D android
          gh run download "$WINDOWS_RUN" -n quiet-vpn-windows-installer -D windows
          gh api "repos/$GH_REPO/contents/pubspec.yaml?ref=$SOURCE_SHA" --jq .content | base64 --decode > pubspec.yaml
      - name: Verify checksums and stage downloads
        if: steps.builds.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re, shutil
          for folder in ['android', 'windows']:
            assert Path(folder, 'SOURCE_COMMIT.txt').read_text().strip() == os.environ['SOURCE_SHA']
          assert re.search(r'Infected files:\s*0\s*$', Path('android/ANTIVIRUS_SCAN.txt').read_text(), re.M)
          version = re.search(r'^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$', Path('pubspec.yaml').read_text(), re.M).group(1)
          apk = Path('android/quiet-vpn-android.apk')
          exe = Path('windows', f'quiet-vpn-{version}-windows-x64-setup.exe')
          apkhash = hashlib.sha256(apk.read_bytes()).hexdigest()
          exehash = hashlib.sha256(exe.read_bytes()).hexdigest()
          assert apkhash == Path('android/SHA256SUMS.txt').read_text().split()[0]
          assert exehash == Path('windows/SHA256SUMS-Windows.txt').read_text().split()[0]
          out = Path('release'); out.mkdir()
          apkname = f'quiet-vpn-{version}.apk'
          shutil.copyfile(apk, out/apkname); shutil.copyfile(exe, out/exe.name)
          (out/'SHA256SUMS.txt').write_text(f'{apkhash}  {apkname}\n{exehash}  {exe.name}\n')
          shutil.copyfile('android/SOURCE_COMMIT.txt', out/'SOURCE_COMMIT.txt')
          Path('notes.md').write_text(f'''## Скачать Quiet VPN {version}
          **Android:** `{apkname}` — Android 8+, ARM64/ARMv7.
          **Windows:** `{exe.name}` — Windows 10/11 x64, установщик с VPN-движками.
          Файлы находятся в Assets ниже. Source code — исходники, не установщики.

          В 0.9.11 (включая исправления 0.9.10): исправлен порядок запуска foreground-служб Android: уведомление появляется до инициализации Xray и до передачи готовности WireGuard. Ошибки запуска Xray корректно останавливают службу. Адреса с неудачным TCP-подключением проверяются повторно и при повторной ошибке не попадают в запуск туннеля; доступные TCP-адреса проверяются раньше непроверенного UDP. Диагностика обновления баз различает таймаут, сетевую ошибку, HTTP и несовместимые профили. На Android добавлено уведомление о низкой скорости по последнему замеру с советом повторного подбора или смены сети; простой трафика предупреждение не вызывает. Загрузка igareck использует официальный адрес GitHack параллельно GitHub RAW и принимает только совместимую базу; фоновое обновление Android также пробует резервный адрес. Пороги скорости сохранены.

          Windows: VLESS/Shadowsocks, WireGuard/AmneziaWG, импорт ключей/файлов, каталог, быстрый и глубокий ИИ, локальное обучение, скорость и диагностика. Исключения приложений доступны только на Android.
          Windows требует прав администратора. Установщик Quiet VPN пока не подписан сертификатом издателя.
          Для встроенного браузера нужен Microsoft Edge WebView2; его установка доступна как дополнительная опция.
          На Windows часть расширенных сведений Wi-Fi/LTE может быть недоступна. При принудительном завершении служба AmneziaWG может остаться включённой; повторный запуск приложения очищает её.

          Проверены анализ Dart, Flutter-тесты, Android-тесты, Windows TUN и DNS/HTTPS через него, жизненный цикл службы AmneziaWG и установщик.
          Подключение к конкретным публичным серверам в вашей сети требует проверки на устройстве.

          [Android CI](https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['ANDROID_RUN']}) · [Windows CI](https://github.com/{os.environ['GH_REPO']}/actions/runs/{os.environ['WINDOWS_RUN']})
          Исходный коммит: {os.environ['SOURCE_SHA']}
          '''.replace('\n          ', '\n'))
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write(f'RELEASE_TAG=v{version}\n')
          PY
      - name: Publish immutable versioned release
        if: steps.builds.outputs.ready == 'true'
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
          if python3 - <<'PY'
          import json, os, sys
          sys.exit(0 if any(r['tag_name'] == os.environ['RELEASE_TAG'] for r in json.load(open('releases.json'))) else 1)
          PY
          then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create "$RELEASE_TAG" release/* --target "$SOURCE_SHA" --title "Quiet VPN $RELEASE_TAG — Android и Windows" --notes-file notes.md
          fi
