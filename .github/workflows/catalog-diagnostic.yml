name: Diagnose live VPN catalog
on:
  push:
    paths: ['.github/workflows/catalog-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live public profiles
        run: |
          python - <<'PY'
          import urllib.request,csv,base64,collections,json
          url='https://www.vpngate.net/api/iphone/'
          with urllib.request.urlopen(url,timeout=45) as r: body=r.read(12582912).decode('utf-8-sig')
          lines=body.replace('\r\n','\n').splitlines(); start=next(i for i,l in enumerate(lines) if l.startswith('#HostName,'))
          data=list(csv.DictReader([lines[start][1:]]+lines[start+1:])); directives=collections.Counter();examples={}
          for row in data:
            raw=row.get('OpenVPN_ConfigData_Base64')
            if not raw:continue
            profile=base64.b64decode(raw).decode(); inside=False
            for line in profile.splitlines():
              line=line.strip()
              if not line or line.startswith(('#',';')):continue
              if line.startswith('<'):inside=not line.startswith('</');continue
              if inside:continue
              k=line.split()[0];directives[k]+=1
              if k not in ['remote']:examples[k]=line
          print(json.dumps({'rows':len(data),'directives':directives,'examples':examples},indent=2))
          PY
